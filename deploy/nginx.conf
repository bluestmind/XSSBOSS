server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Request-ID $request_id;
        # Authentication is deliberately end-to-end. Do not inject a shared
        # tenant credential here: doing so turns every reachable browser into
        # the default tenant.
    }
    location /health { proxy_pass http://api:8000; }
    location /ready { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
