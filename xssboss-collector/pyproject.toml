[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xssboss-collector"
version = "1.3.0"
description = "Collection-only web attack-surface inventory derived from XSSBOSS reconnaissance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - authorized assessment use only"}
authors = [{name = "XSSBOSS"}]
dependencies = []

[project.scripts]
xsscollect = "xsscollector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xsscollector = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
