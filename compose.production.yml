services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xssboss
      POSTGRES_USER: xssboss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xssboss -d xssboss"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment: &backend-env
      ENVIRONMENT: production
      DATABASE_URL: postgresql://xssboss:${POSTGRES_PASSWORD}@postgres:5432/xssboss
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATION_MODE: celery
      # Must be reachable by the scanned browser. Use the public HTTPS origin
      # that routes /api/v1/oracle to this API; container-local HTTP is blocked
      # as mixed content on HTTPS targets.
      ORACLE_SERVER_URL: ${ORACLE_SERVER_URL:?set browser-reachable ORACLE_SERVER_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN}
      TENANT_API_TOKENS: ${TENANT_API_TOKENS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      BURP_ENABLED: ${BURP_ENABLED:-False}
      BURP_API_KEY: ${BURP_API_KEY:-}
      BURP_AUTO_START: ${BURP_AUTO_START:-False}
      BURP_PROGRAM_AUTO_SCAN: ${BURP_PROGRAM_AUTO_SCAN:-False}
      BURP_PROXY_WORKERS: ${BURP_PROXY_WORKERS:-False}
      PROXY_ENABLED: ${PROXY_ENABLED:-False}
      UPSTREAM_ROTATING_PROXY_ENABLED: ${UPSTREAM_ROTATING_PROXY_ENABLED:-False}
      WAF_BYPASS_HEADERS: ${WAF_BYPASS_HEADERS:-False}
      ALLOW_INSECURE_TLS: ${ALLOW_INSECURE_TLS:-False}
      LLM_ENABLED: ${LLM_ENABLED:-False}
      LLM_PREFER_LOCAL: ${LLM_PREFER_LOCAL:-True}
      LLM_API_URL: ${LLM_API_URL:-http://127.0.0.1:11434/api/generate}
      LLM_MODEL: ${LLM_MODEL:-WhiteRabbitNeo/WhiteRabbitNeo-V3-7B:latest}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-768}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MIDSCAN_MAX_CALLS: ${LLM_MIDSCAN_MAX_CALLS:-8}
      LLM_MIDSCAN_MIN_CONFIDENCE: ${LLM_MIDSCAN_MIN_CONFIDENCE:-0.65}
      LLM_ALLOW_REMOTE_SECURITY_DATA: ${LLM_ALLOW_REMOTE_SECURITY_DATA:-False}
      BROWSER_LEASE_SECONDS: ${BROWSER_LEASE_SECONDS:-900}
      USE_UNDETECTED_CHROME: ${USE_UNDETECTED_CHROME:-False}
      BROWSER_NAVIGATION_TIMEOUT: ${BROWSER_NAVIGATION_TIMEOUT:-25}
      ORACLE_WAIT_TIMEOUT: ${ORACLE_WAIT_TIMEOUT:-2.0}
      BROWSER_RESTART_EVERY_TESTS: ${BROWSER_RESTART_EVERY_TESTS:-20}
      BYPASS_CSP: ${BYPASS_CSP:-False}
      CAPTURE_SCREENSHOTS: ${CAPTURE_SCREENSHOTS:-hits}
      CAPTURE_DOM_SNAPSHOT: ${CAPTURE_DOM_SNAPSHOT:-hits}
      CAPTURE_RUNTIME_COVERAGE: ${CAPTURE_RUNTIME_COVERAGE:-all}
      CAPTURE_RUNTIME_LINEAGE: ${CAPTURE_RUNTIME_LINEAGE:-all}
      RUNTIME_LINEAGE_AAB_PROBES: ${RUNTIME_LINEAGE_AAB_PROBES:-False}
      RUNTIME_LINEAGE_HMAC_KEY_VERSION: ${RUNTIME_LINEAGE_HMAC_KEY_VERSION:-1}
      CAPTURE_DOM_DIFFERENTIAL: ${CAPTURE_DOM_DIFFERENTIAL:-all}
      DOM_SNAPSHOT_MAX_CHARS: ${DOM_SNAPSHOT_MAX_CHARS:-8000}
      MAX_PAYLOADS_PER_CONTEXT: ${MAX_PAYLOADS_PER_CONTEXT:-32}
      MAX_TEST_CASES_PER_EXPERIMENT: ${MAX_TEST_CASES_PER_EXPERIMENT:-1500}
      MAX_QUEUE_ACTIVE: ${MAX_QUEUE_ACTIVE:-1}
      MAX_PROFILING_WORKERS: ${MAX_PROFILING_WORKERS:-1}
      REQUEST_DELAY_MS: ${REQUEST_DELAY_MS:-1200}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-40}
      RATE_LIMIT_REDIS_ENABLED: ${RATE_LIMIT_REDIS_ENABLED:-True}
      RATE_LIMIT_REDIS_REQUIRED: ${RATE_LIMIT_REDIS_REQUIRED:-True}
      RATE_LIMIT_REDIS_RETRY_SECS: ${RATE_LIMIT_REDIS_RETRY_SECS:-30}
      RATE_LIMIT_FALLBACK_WORKER_ESTIMATE: ${RATE_LIMIT_FALLBACK_WORKER_ESTIMATE:-8}
      ADAPTIVE_THROTTLE: ${ADAPTIVE_THROTTLE:-True}
      THROTTLE_BACKOFF_MULTIPLIER: ${THROTTLE_BACKOFF_MULTIPLIER:-2.5}
      THROTTLE_MAX_DELAY_MS: ${THROTTLE_MAX_DELAY_MS:-60000}
      JITTER_FACTOR: ${JITTER_FACTOR:-0.15}
      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-True}
      CIRCUIT_BREAKER_THRESHOLD: ${CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_RECOVERY_SECS: ${CIRCUIT_BREAKER_RECOVERY_SECS:-120}
      ROTATE_USER_AGENT: ${ROTATE_USER_AGENT:-False}
      CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-7200}
      EVIDENCE_DIR: /app/evidence
      AUDIT_MODE: celery
    volumes: &evidence-volumes
      - reports:/app/reports
      - screenshots:/app/screenshots
      - evidence:/app/evidence
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  orchestrator:
    build:
      context: .
      target: api
    command: ["celery", "-A", "backend_api.task_queue:task_app", "worker", "-Q", "orchestration,maintenance", "--concurrency=2", "--loglevel=INFO"]
    environment: *backend-env
    volumes: *evidence-volumes
    depends_on:
      api: {condition: service_healthy}

  browser-worker:
    build:
      context: .
      target: browser
    environment:
      <<: *backend-env
      # The browser processes untrusted content and do not need API credentials.
      API_AUTH_TOKEN: ""
      TENANT_API_TOKENS: ""
    volumes: *evidence-volumes
    shm_size: 2gb
    read_only: true
    tmpfs: [/tmp, /home/xssboss/.cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: {condition: service_healthy}

  audit-worker:
    build:
      context: .
      target: api
    command: ["celery", "-A", "backend_api.task_queue:task_app", "worker", "-Q", "audit", "--concurrency=1", "--loglevel=INFO"]
    environment: *backend-env
    volumes: *evidence-volumes
    depends_on:
      api: {condition: service_healthy}

  scheduler:
    build:
      context: .
      target: api
    command: ["celery", "-A", "backend_api.task_queue:task_app", "beat", "--loglevel=INFO"]
    environment: *backend-env
    depends_on:
      api: {condition: service_healthy}

  ui:
    build:
      context: .
      target: ui
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/xssboss-alerts.yml:/etc/prometheus/xssboss-alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      api: {condition: service_healthy}

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
  reports:
  screenshots:
  evidence:
  prometheus-data:
  grafana-data:
